<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/libreta-de-alabanzas/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Libreta de Alabanzas IEP — Himnario oficial con 408 himnos, acordes y reproductor de audio.">
  <meta name="theme-color" content="#173B3F">

  <!-- iOS Safari PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Libreta IEP">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Libreta de Alabanzas IEP</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background-color: #173B3F;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #173B3F 0%, #167D75 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #loading-splash img {
      width: 104px;
      height: 104px;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      margin-bottom: 16px;
    }
    #loading-splash h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0 0 6px 0;
    }
    #loading-splash p {
      font-size: 13px;
      opacity: 0.85;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="icons/apple-touch-icon.png" alt="Libreta de Alabanzas IEP">
    <h1>LIBRETA DE ALABANZAS</h1>
    <p>Cargando himnario...</p>
  </div>

  <script>
    // Limpiar cualquier Service Worker antiguo silenciosamente sin forzar recargas en iOS Standalone PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister().catch(function () {}); });
      }).catch(function () {});
    }

    // Garantizar que la pantalla de carga nunca bloquee toques en Safari iOS Standalone
    (function () {
      var removed = false;
      function hideSplash() {
        if (removed) return;
        removed = true;
        var splash = document.getElementById('loading-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 260);
        }
      }
      window.addEventListener('flutter-first-frame', hideSplash, { once: true });
      if (typeof MutationObserver !== 'undefined') {
        var obs = new MutationObserver(function () {
          if (document.querySelector('flt-glass-pane, flutter-view')) {
            hideSplash();
            obs.disconnect();
          }
        });
        obs.observe(document.body, { childList: true, subtree: true });
      }
      setTimeout(hideSplash, 4500);
    })();

    // Stub de caché web (compatibilidad)
    window.libretaAudioCache = {
      getBlobUrl: async function () { return null; },
      putAudio: async function () { return null; },
      hasAudio: async function () { return false; },
      deleteAudio: async function () {}
    };

    // Reproductor HTML5 <audio playsinline> nativo Same-Origin (instantáneo en Safari iOS + fallback Google Drive)
    window.libretaWebPlayer = (function () {
      var audio = null;
      var endedFlag = false;
      var playSeq = 0;

      // Mapa embebido directo (0 ms, sin BOM ni fetch pendiente) + actualización en segundo plano desde audios/manifest.json
      var manifest = {"hymn_209":"audios/hymn_209.mp3","hymn_142":"audios/hymn_142.mp3","hymn_17":"audios/hymn_17.mp3","hymn_174":"audios/hymn_174.mp3","hymn_146":"audios/hymn_146.mp3","hymn_364":"audios/hymn_364.m4a","hymn_230":"audios/hymn_230.mp3","hymn_324":"audios/hymn_324.mp3","hymn_310":"audios/hymn_310.mp3","hymn_403":"audios/hymn_403.m4a","hymn_329":"audios/hymn_329.mp3","hymn_312":"audios/hymn_312.mp3","hymn_140":"audios/hymn_140.mp3","hymn_320":"audios/hymn_320.mp3","hymn_229":"audios/hymn_229.mp3","hymn_4":"audios/hymn_4.mp3","hymn_197":"audios/hymn_197.mp3","hymn_13":"audios/hymn_13.mp3","hymn_11":"audios/hymn_11.mp3","hymn_217":"audios/hymn_217.mp3","hymn_303":"audios/hymn_303.mp3","hymn_309":"audios/hymn_309.mp3","hymn_213":"audios/hymn_213.mp3","hymn_176":"audios/hymn_176.mp3","hymn_307":"audios/hymn_307.mp3","hymn_321":"audios/hymn_321.mp3","hymn_129":"audios/hymn_129.mp3","hymn_326":"audios/hymn_326.mp3","hymn_7":"audios/hymn_7.m4a","hymn_195":"audios/hymn_195.mp3","hymn_9":"audios/hymn_9.m4a","hymn_165":"audios/hymn_165.m4a","hymn_198":"audios/hymn_198.mp3","hymn_3":"audios/hymn_3.m4a","hymn_18":"audios/hymn_18.mp3","hymn_15":"audios/hymn_15.mp3","hymn_150":"audios/hymn_150.mp3","hymn_330":"audios/hymn_330.mp3","hymn_5":"audios/hymn_5.m4a","hymn_308":"audios/hymn_308.mp3","hymn_131":"audios/hymn_131.m4a","hymn_1793632403086":"audios/hymn_1793632403086.mp3","hymn_6":"audios/hymn_6.mp3","hymn_305":"audios/hymn_305.mp3","hymn_191":"audios/hymn_191.mp3","hymn_332":"audios/hymn_332.mp3","hymn_12":"audios/hymn_12.mp3","hymn_141":"audios/hymn_141.mp3","hymn_2":"audios/hymn_2.mp3","hymn_1":"audios/hymn_1.m4a","hymn_19":"audios/hymn_19.mp3","hymn_24":"audios/hymn_24.mp3","hymn_175":"audios/hymn_175.mp3","hymn_306":"audios/hymn_306.mp3","hymn_132":"audios/hymn_132.m4a","hymn_21":"audios/hymn_21.mp3","hymn_328":"audios/hymn_328.mp3","hymn_151":"audios/hymn_151.mp3","hymn_144":"audios/hymn_144.mp3","hymn_405":"audios/hymn_405.m4a","hymn_20":"audios/hymn_20.mp3","hymn_322":"audios/hymn_322.mp3","hymn_222":"audios/hymn_222.mp3","hymn_189":"audios/hymn_189.mp3","hymn_170":"audios/hymn_170.mp3"};

      fetch('./audios/manifest.json')
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (txt) {
          if (!txt) return;
          var clean = txt.replace(/^\uFEFF/, '');
          var data = JSON.parse(clean);
          if (data && typeof data === 'object') {
            Object.assign(manifest, data);
          }
        })
        .catch(function () {});

      function ensureAudio() {
        if (audio) return audio;
        audio = document.createElement('audio');
        audio.setAttribute('playsinline', '');
        audio.setAttribute('webkit-playsinline', '');
        audio.preload = 'auto';
        audio.style.display = 'none';
        audio.addEventListener('ended', function () {
          endedFlag = true;
        });
        if (document.body) {
          document.body.appendChild(audio);
        }
        return audio;
      }

      return {
        unlock: function () {
          ensureAudio();
          try {
            if (navigator.audioSession && navigator.audioSession.type !== 'playback') {
              navigator.audioSession.type = 'playback';
            }
          } catch (_) {}
        },

        playHymn: function (hymnId, fallbackDriveUrl) {
          var a = ensureAudio();
          var mySeq = ++playSeq;
          endedFlag = false;

          var localRel = manifest[hymnId];
          var targetUrl = localRel
            ? new URL('./' + localRel, window.location.href).toString()
            : fallbackDriveUrl;

          if (!targetUrl) {
            return Promise.reject(new Error('No hay audio registrado para este himno'));
          }

          try {
            if (navigator.audioSession && navigator.audioSession.type !== 'playback') {
              navigator.audioSession.type = 'playback';
            }
          } catch (_) {}

          a.pause();
          a.muted = false;
          a.volume = 1.0;
          a.src = targetUrl;

          var playPromise = a.play();
          if (playPromise && typeof playPromise.then === 'function') {
            return playPromise.then(function () {
              return mySeq === playSeq ? 'streamed' : 'superseded';
            }).catch(function (err) {
              if (mySeq !== playSeq) return 'superseded';
              if (localRel && fallbackDriveUrl && targetUrl !== fallbackDriveUrl) {
                a.src = fallbackDriveUrl;
                return a.play().then(function () {
                  return mySeq === playSeq ? 'streamed' : 'superseded';
                });
              }
              throw err;
            });
          }
          return Promise.resolve('streamed');
        },

        pause: function () {
          if (audio) audio.pause();
        },

        resume: function () {
          var a = ensureAudio();
          if (!a.src) return Promise.resolve();
          endedFlag = false;
          a.muted = false;
          var p = a.play();
          return (p && typeof p.then === 'function') ? p : Promise.resolve();
        },

        stop: function () {
          playSeq++;
          endedFlag = false;
          if (!audio) return;
          audio.pause();
          try { audio.currentTime = 0; } catch (_) {}
        },

        seekMs: function (ms) {
          if (!audio) return;
          try {
            audio.currentTime = Math.max(0, ms / 1000);
          } catch (_) {}
        },

        getPositionMs: function () {
          if (!audio || !audio.src) return 0;
          var t = audio.currentTime;
          return (isFinite(t) && t >= 0) ? Math.floor(t * 1000) : 0;
        },

        getDurationMs: function () {
          if (!audio || !audio.src) return 0;
          var d = audio.duration;
          return (isFinite(d) && d > 0) ? Math.floor(d * 1000) : 0;
        },

        isPaused: function () {
          if (!audio) return true;
          return !!audio.paused;
        },

        consumeEnded: function () {
          if (!endedFlag) return false;
          endedFlag = false;
          return true;
        },

        clearDecoded: function () {}
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
