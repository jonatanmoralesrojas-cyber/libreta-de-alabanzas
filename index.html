<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/libreta-de-alabanzas/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Libreta de Alabanzas IEP — Himnario oficial con 408 himnos, acordes y reproductor de audio.">
  <meta name="theme-color" content="#173B3F">

  <!-- iOS Safari PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Libreta IEP">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Libreta de Alabanzas IEP</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #173B3F;
      overscroll-behavior: none;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #173B3F 0%, #167D75 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading-splash img {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      margin-bottom: 18px;
    }
    #loading-splash h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0 0 6px 0;
    }
    #loading-splash p {
      font-size: 13px;
      opacity: 0.85;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="icons/apple-touch-icon.png" alt="Libreta de Alabanzas IEP">
    <h1>LIBRETA DE ALABANZAS</h1>
    <p>Cargando himnario...</p>
  </div>

  <script>
    // Caché persistente offline de audios (Cache API + Blob URL) para Safari iOS y navegadores PWA
    window.libretaAudioCache = (function () {
      var CACHE_NAME = 'libreta-hymn-audios-v1';
      var blobUrls = {};

      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function () {});
      }

      function cacheKey(id) {
        return new URL('./__hymn_audio_cache__/' + encodeURIComponent(id), window.location.href).toString();
      }

      return {
        getBlobUrl: async function (id) {
          if (blobUrls[id]) return blobUrls[id];
          if (!('caches' in window)) return null;
          try {
            var cache = await caches.open(CACHE_NAME);
            var resp = await cache.match(cacheKey(id));
            if (!resp) return null;
            var blob = await resp.blob();
            if (!blob || blob.size < 1000) return null;
            var url = URL.createObjectURL(blob);
            blobUrls[id] = url;
            return url;
          } catch (e) {
            return null;
          }
        },
        putAudio: async function (id, uint8Array, mimeType) {
          var type = mimeType || 'audio/mp4';
          var blob = new Blob([uint8Array], { type: type });
          if (blobUrls[id]) {
            try { URL.revokeObjectURL(blobUrls[id]); } catch (_) {}
          }
          var url = URL.createObjectURL(blob);
          blobUrls[id] = url;
          if ('caches' in window) {
            try {
              var cache = await caches.open(CACHE_NAME);
              var resp = new Response(blob, {
                headers: {
                  'Content-Type': type,
                  'Content-Length': String(blob.size)
                }
              });
              await cache.put(cacheKey(id), resp);
            } catch (e) {}
          }
          return url;
        },
        hasAudio: async function (id) {
          if (blobUrls[id]) return true;
          if (!('caches' in window)) return false;
          try {
            var cache = await caches.open(CACHE_NAME);
            var resp = await cache.match(cacheKey(id));
            return !!resp;
          } catch (e) {
            return false;
          }
        },
        deleteAudio: async function (id) {
          if (blobUrls[id]) {
            try { URL.revokeObjectURL(blobUrls[id]); } catch (_) {}
            delete blobUrls[id];
          }
          if (!('caches' in window)) return;
          try {
            var cache = await caches.open(CACHE_NAME);
            await cache.delete(cacheKey(id));
          } catch (e) {}
        }
      };
    })();

    // Reproductor HTML5 <audio> nativo reutilizable (evita AbortError y bugs de WebAudio en Safari iOS)
    window.libretaWebPlayer = (function () {
      var SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
      var audio = null;
      var unlocked = false;
      var endedFlag = false;
      var activeSrc = '';
      var playSeq = 0;

      function ensureAudio() {
        if (audio) return audio;
        audio = document.createElement('audio');
        audio.setAttribute('playsinline', '');
        audio.setAttribute('webkit-playsinline', '');
        audio.preload = 'auto';
        audio.style.display = 'none';
        audio.addEventListener('ended', function () {
          if (activeSrc && activeSrc !== SILENT_WAV) {
            endedFlag = true;
          }
        });
        if (document.body) {
          document.body.appendChild(audio);
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            if (audio && !audio.parentNode && document.body) {
              document.body.appendChild(audio);
            }
          });
        }
        return audio;
      }

      return {
        // Llamar SINCRÓNICAMENTE al tocar Play (antes de cualquier await/fetch) para desbloquear Safari iOS
        unlock: function () {
          var a = ensureAudio();
          if (unlocked) return;
          try {
            a.muted = true;
            a.src = SILENT_WAV;
            activeSrc = SILENT_WAV;
            var p = a.play();
            if (p && typeof p.then === 'function') {
              p.then(function () {
                unlocked = true;
                if (activeSrc === SILENT_WAV) {
                  a.pause();
                }
              }).catch(function () {});
            } else {
              unlocked = true;
            }
          } catch (_) {}
        },

        playUrl: async function (url, fallbackUrl) {
          var a = ensureAudio();
          var mySeq = ++playSeq;
          endedFlag = false;

          async function tryPlay(targetUrl) {
            a.pause();
            a.muted = false;
            a.volume = 1.0;
            activeSrc = targetUrl;
            a.src = targetUrl;
            if (mySeq !== playSeq) return 'superseded';
            var p = a.play();
            if (p && typeof p.then === 'function') {
              await p;
            }
            unlocked = true;
            return 'ok';
          }

          try {
            return await tryPlay(url);
          } catch (err1) {
            if (mySeq !== playSeq) return 'superseded';
            if (fallbackUrl && fallbackUrl !== url) {
              try {
                return await tryPlay(fallbackUrl);
              } catch (err2) {
                throw err2;
              }
            }
            throw err1;
          }
        },

        pause: function () {
          if (audio) audio.pause();
        },

        resume: async function () {
          var a = ensureAudio();
          if (!activeSrc || activeSrc === SILENT_WAV) return;
          endedFlag = false;
          a.muted = false;
          var p = a.play();
          if (p && typeof p.then === 'function') {
            await p;
          }
        },

        stop: function () {
          playSeq++;
          endedFlag = false;
          if (!audio) return;
          audio.pause();
          try { audio.currentTime = 0; } catch (_) {}
        },

        seekMs: function (ms) {
          if (!audio) return;
          try {
            audio.currentTime = Math.max(0, ms / 1000);
          } catch (_) {}
        },

        getPositionMs: function () {
          if (!audio || !activeSrc || activeSrc === SILENT_WAV) return 0;
          var t = audio.currentTime;
          return (isFinite(t) && t >= 0) ? Math.floor(t * 1000) : 0;
        },

        getDurationMs: function () {
          if (!audio || !activeSrc || activeSrc === SILENT_WAV) return 0;
          var d = audio.duration;
          return (isFinite(d) && d > 0) ? Math.floor(d * 1000) : 0;
        },

        isPaused: function () {
          if (!audio) return true;
          return !!audio.paused;
        },

        consumeEnded: function () {
          if (!endedFlag) return false;
          endedFlag = false;
          return true;
        }
      };
    })();

    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
