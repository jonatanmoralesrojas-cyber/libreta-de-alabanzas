<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/libreta-de-alabanzas/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Libreta de Alabanzas IEP — Himnario oficial con 408 himnos, acordes y reproductor de audio.">
  <meta name="theme-color" content="#173B3F">

  <!-- iOS Safari PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Libreta IEP">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Libreta de Alabanzas IEP</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #173B3F;
      overscroll-behavior: none;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #173B3F 0%, #167D75 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading-splash img {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      margin-bottom: 18px;
    }
    #loading-splash h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0 0 6px 0;
    }
    #loading-splash p {
      font-size: 13px;
      opacity: 0.85;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="icons/apple-touch-icon.png" alt="Libreta de Alabanzas IEP">
    <h1>LIBRETA DE ALABANZAS</h1>
    <p>Cargando himnario...</p>
  </div>

  <script>
    // Caché persistente offline de audios (Cache API + Blob URL) para Safari iOS y navegadores PWA
    window.libretaAudioCache = (function () {
      var CACHE_NAME = 'libreta-hymn-audios-v1';
      var blobUrls = {};

      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function () {});
      }

      function cacheKey(id) {
        return new URL('./__hymn_audio_cache__/' + encodeURIComponent(id), window.location.href).toString();
      }

      return {
        getBlobUrl: async function (id) {
          if (blobUrls[id]) return blobUrls[id];
          if (!('caches' in window)) return null;
          try {
            var cache = await caches.open(CACHE_NAME);
            var resp = await cache.match(cacheKey(id));
            if (!resp) return null;
            var blob = await resp.blob();
            if (!blob || blob.size < 1000) return null;
            var url = URL.createObjectURL(blob);
            blobUrls[id] = url;
            return url;
          } catch (e) {
            return null;
          }
        },
        putAudio: async function (id, uint8Array, mimeType) {
          var type = mimeType || 'audio/mp4';
          var blob = new Blob([uint8Array], { type: type });
          if (blobUrls[id]) {
            try { URL.revokeObjectURL(blobUrls[id]); } catch (_) {}
          }
          var url = URL.createObjectURL(blob);
          blobUrls[id] = url;
          if ('caches' in window) {
            try {
              var cache = await caches.open(CACHE_NAME);
              var resp = new Response(blob, {
                headers: {
                  'Content-Type': type,
                  'Content-Length': String(blob.size)
                }
              });
              await cache.put(cacheKey(id), resp);
            } catch (e) {}
          }
          return url;
        },
        hasAudio: async function (id) {
          if (blobUrls[id]) return true;
          if (!('caches' in window)) return false;
          try {
            var cache = await caches.open(CACHE_NAME);
            var resp = await cache.match(cacheKey(id));
            return !!resp;
          } catch (e) {
            return false;
          }
        },
        deleteAudio: async function (id) {
          if (blobUrls[id]) {
            try { URL.revokeObjectURL(blobUrls[id]); } catch (_) {}
            delete blobUrls[id];
          }
          if (!('caches' in window)) return;
          try {
            var cache = await caches.open(CACHE_NAME);
            await cache.delete(cacheKey(id));
          } catch (e) {}
        }
      };
    })();

    // Reproductor Web Audio API (AudioContext + decodeAudioData + Cache API offline)
    // Inmune a NotSupportedError/AbortError de Safari iOS con blob: URLs y Content-Type incorrectos de Drive
    window.libretaWebPlayer = (function () {
      var CACHE_NAME = 'libreta-hymn-audios-v1';
      var ctx = null;
      var currentSource = null;
      var currentBuffer = null;
      var decodedBuffers = {};
      var startCtxTime = 0;
      var offsetSec = 0;
      var isPausedState = true;
      var endedFlag = false;
      var playSeq = 0;

      function cacheKey(id) {
        return new URL('./__hymn_audio_cache__/' + encodeURIComponent(id), window.location.href).toString();
      }

      function ensureContext() {
        if (!ctx) {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          ctx = new AudioCtx();
        }
        try {
          if (navigator.audioSession && navigator.audioSession.type !== 'playback') {
            navigator.audioSession.type = 'playback';
          }
        } catch (_) {}
        return ctx;
      }

      function decodeBuffer(audioCtx, arrayBuffer) {
        return new Promise(function (resolve, reject) {
          var copy = arrayBuffer.slice(0);
          var res = audioCtx.decodeAudioData(
            copy,
            function (decoded) { resolve(decoded); },
            function (err) { reject(err || new Error('No se pudo decodificar el audio')); }
          );
          if (res && typeof res.then === 'function') {
            res.then(resolve).catch(reject);
          }
        });
      }

      function stopCurrentSourceOnly() {
        if (currentSource) {
          try {
            currentSource.onended = null;
            currentSource.stop(0);
            currentSource.disconnect();
          } catch (_) {}
          currentSource = null;
        }
      }

      function startBufferAt(audioCtx, buffer, startOffsetSec, mySeq) {
        stopCurrentSourceOnly();
        currentBuffer = buffer;
        offsetSec = Math.max(0, Math.min(startOffsetSec, buffer.duration));
        endedFlag = false;
        var src = audioCtx.createBufferSource();
        src.buffer = buffer;
        src.connect(audioCtx.destination);
        src.onended = function () {
          if (mySeq === playSeq && currentSource === src && !isPausedState) {
            currentSource = null;
            isPausedState = true;
            offsetSec = buffer.duration;
            endedFlag = true;
          }
        };
        currentSource = src;
        startCtxTime = audioCtx.currentTime;
        isPausedState = false;
        src.start(0, offsetSec);
      }

      function looksLikeHtml(bytes) {
        if (!bytes || bytes.length < 15) return false;
        var head = '';
        for (var i = 0; i < Math.min(48, bytes.length); i++) {
          head += String.fromCharCode(bytes[i]);
        }
        head = head.trim().toLowerCase();
        return head.indexOf('<!doctype html') === 0 ||
               head.indexOf('<html') === 0 ||
               head.indexOf('<?xml') === 0;
      }

      return {
        // Desbloqueo síncrono obligatorio dentro del toque del usuario en Safari iOS
        unlock: function () {
          try {
            var audioCtx = ensureContext();
            if (audioCtx.state === 'suspended') {
              audioCtx.resume().catch(function () {});
            }
            var silent = audioCtx.createBuffer(1, 1, 22050);
            var src = audioCtx.createBufferSource();
            src.buffer = silent;
            src.connect(audioCtx.destination);
            src.start(0);
          } catch (_) {}
        },

        // Carga desde memoria / Cache API offline / fetch CORS a Drive, decodifica con CoreAudio y reproduce
        playHymn: async function (hymnId, directUrl) {
          var audioCtx = ensureContext();
          var mySeq = ++playSeq;
          endedFlag = false;
          stopCurrentSourceOnly();

          if (audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch (_) {}
          }

          // 1. Ya decodificado en memoria -> reproducción instantánea (0 ms)
          if (decodedBuffers[hymnId]) {
            if (mySeq !== playSeq) return 'superseded';
            startBufferAt(audioCtx, decodedBuffers[hymnId], 0, mySeq);
            return 'cached';
          }

          // 2. Buscar en Cache API persistente (100% offline aunque cierre la app o esté en Modo Avión)
          var rawBuffer = null;
          var downloadedNow = false;
          if ('caches' in window) {
            try {
              var cache = await caches.open(CACHE_NAME);
              var cachedResp = await cache.match(cacheKey(hymnId));
              if (cachedResp) {
                var cachedAb = await cachedResp.arrayBuffer();
                if (cachedAb && cachedAb.byteLength > 1000 && !looksLikeHtml(new Uint8Array(cachedAb.slice(0, 64)))) {
                  rawBuffer = cachedAb;
                } else {
                  await cache.delete(cacheKey(hymnId));
                }
              }
            } catch (_) {}
          }

          // 3. Si no está en caché local, descargar directo desde Drive con CORS
          if (!rawBuffer) {
            if (!directUrl) {
              throw new Error('No hay audio registrado para este himno');
            }
            var resp = await fetch(directUrl, { mode: 'cors', credentials: 'omit' });
            if (!resp.ok) {
              throw new Error('Error descargando audio (HTTP ' + resp.status + ')');
            }
            rawBuffer = await resp.arrayBuffer();
            if (!rawBuffer || rawBuffer.byteLength <= 1000 || looksLikeHtml(new Uint8Array(rawBuffer.slice(0, 64)))) {
              throw new Error('El servidor no devolvió un archivo de audio válido');
            }
            downloadedNow = true;

            // Guardar en Cache API para uso 100% offline futuro
            if ('caches' in window) {
              try {
                var c = await caches.open(CACHE_NAME);
                await c.put(
                  cacheKey(hymnId),
                  new Response(rawBuffer.slice(0), {
                    headers: {
                      'Content-Type': 'audio/mp4',
                      'Content-Length': String(rawBuffer.byteLength)
                    }
                  })
                );
              } catch (_) {}
            }
          }

          if (mySeq !== playSeq) return 'superseded';

          var decoded = await decodeBuffer(audioCtx, rawBuffer);
          decodedBuffers[hymnId] = decoded;

          if (mySeq !== playSeq) return 'superseded';

          if (audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch (_) {}
          }

          startBufferAt(audioCtx, decoded, 0, mySeq);
          return downloadedNow ? 'downloaded' : 'cached';
        },

        pause: function () {
          if (!ctx || !currentBuffer || isPausedState) return;
          offsetSec = Math.max(0, Math.min(offsetSec + (ctx.currentTime - startCtxTime), currentBuffer.duration));
          isPausedState = true;
          stopCurrentSourceOnly();
        },

        resume: async function () {
          if (!currentBuffer || !isPausedState) return;
          var audioCtx = ensureContext();
          if (audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch (_) {}
          }
          var mySeq = ++playSeq;
          startBufferAt(audioCtx, currentBuffer, offsetSec >= currentBuffer.duration ? 0 : offsetSec, mySeq);
        },

        stop: function () {
          playSeq++;
          endedFlag = false;
          isPausedState = true;
          offsetSec = 0;
          currentBuffer = null;
          stopCurrentSourceOnly();
        },

        seekMs: function (ms) {
          if (!currentBuffer) return;
          var targetSec = Math.max(0, Math.min(ms / 1000, currentBuffer.duration));
          offsetSec = targetSec;
          if (!isPausedState && ctx) {
            var mySeq = ++playSeq;
            startBufferAt(ctx, currentBuffer, targetSec, mySeq);
          }
        },

        getPositionMs: function () {
          if (!currentBuffer) return 0;
          if (isPausedState || !ctx) {
            return Math.floor(offsetSec * 1000);
          }
          var cur = Math.min(offsetSec + (ctx.currentTime - startCtxTime), currentBuffer.duration);
          return Math.max(0, Math.floor(cur * 1000));
        },

        getDurationMs: function () {
          if (!currentBuffer) return 0;
          return Math.floor(currentBuffer.duration * 1000);
        },

        isPaused: function () {
          return isPausedState;
        },

        consumeEnded: function () {
          if (!endedFlag) return false;
          endedFlag = false;
          return true;
        },

        clearDecoded: function (hymnId) {
          delete decodedBuffers[hymnId];
        }
      };
    })();

    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
